<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>

    <form class="row container">
        <div class="col-6">
            <label for="Fname" class="form-label">First Name</label>
            <input type="text" name="Fname" class="form-control">
        </div>
        <div class="col-6">
            <label for="Lname" class="form-label">Last Name</label>
            <input type="text" name="Lname" class="form-control">
        </div>
        <div class="col-12">
            <label for="address" class="form-label">Address</label>
            <input type="text" name="address" class="form-control">
        </div>
        <div class="col-4">
            <label for="city" class="form-label">City</label>
            <input type="text" name="city" id="city" class="form-control">
        </div>
        <div class="col-6">
            <label for="state">State</label>
            <select name="state" class="form-select">
                <option selected>Choose A State</option>
                <option>Gujarat</option>
                <option>Punjab</option>
                <option>Hariyana</option>
            </select>
        </div>
        <div class="col-2">
            <label for="pincode" class="form-label">Pin Code</label>
            <input type="number" name="pincode" class="form-control">
        </div>
        <div class="form-check">
            <input type="checkbox" class="form-check-input" id="check">
            <label class="form-check-label" for="check">Select</label>
        </div>
        <div class="form-check">
            <input type="radio" id="radio" name="flexRadioDefault" class="form-check-input">
            <label for="radio" class="form-check-label">Radio</label>
        </div>
        <div class="form-check">
            <input type="radio" id="radio2" name="flexRadioDefault" class="form-check-input">
            <label for="radio2" class="form-check-label">Radio2</label>
        </div>
        <div class="form-check form-switch">
            <input type="checkbox" id="switch" name="switch" class="form-check-input">
            <label for="switch" class="form-check-label">Switch</label>
        </div>
    </form>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</body>

</html>
