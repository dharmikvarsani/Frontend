<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Method</title>
</head>

<body>

    <script>

        //tostring
        {
            let a = 45
            let b = 76
            let c = a + b
            console.log(c)

            a.toString();
            (76).toString();
            let r = 45;
            let g = r.toString()
            console.log(typeof(g))
        }

        //toexponential  **************************************************

        {
            let a = 45

            console.log(a.toExponential())
            console.log(a.toExponential(2))
            console.log(a.toExponential(5))

            let b = 25.46

            console.log(b.toExponential())


        }


        //tofixed

        {
            let a = 10.4597

            console.log(a.toFixed())
            console.log(a.toFixed(2))
            console.log(a.toFixed(4))
            console.log(a.toFixed(6))
        }


        //toPrecision

        {
            let a = 25.48652

            console.log(a.toPrecision(2))
            console.log(a.toPrecision(4))
            console.log(a.toPrecision(6))
        }


        //valueof

        {
            let a = 45.66

            console.log(a.valueOf())
            console.log((56).valueOf())
            console.log((56.4896).valueOf())
        }






        //Converting Variables to Numbers

        // number

        {
            console.log(Number(55.22))
            console.log(Number("123"))
            console.log(Number("456.43"))
            console.log(Number(true))
            console.log(Number(false))
            console.log(Number("14,56"))
            console.log(Number("Hii"))
            console.log(Number(1232))
            console.log(Number(12))


            console.log(Number(new Date("2013-5-23")))
            console.log(Number(new Date()))
        }


        //parseint

        {
            console.log(parseInt(11))
            console.log(parseInt(16.79))
            console.log(parseInt(12.44))
            console.log(parseInt(-12.5))
            console.log(parseInt("-45. 88 "))
            console.log(parseInt('   4 . 88'))
            console.log(parseInt("Hey"))
        }

        //parsefloat

        {
            console.log(parseFloat(22))
            console.log(parseFloat(2.46))
            console.log(parseFloat(-56))
            console.log(parseFloat("45. 56"))
            console.log(parseFloat(22.765))
            console.log(parseFloat("abc"))
        }


        // number object

        {
            console.log(Number.isInteger(45))
            console.log(Number.isInteger(45.76))
            console.log(Number.isInteger("42"))
            console.log(Number.isInteger(-76))
            console.log(Number.isInteger(-76.86))
            console.log(Number.isInteger("abc"))
        }

        //*************
        {
            console.log(Number.isSafeInteger(4))
            console.log(Number.isSafeInteger(45))
            console.log(Number.isSafeInteger(545))
        }


        {
            console.log(Number.parseFloat(45))
            console.log(Number.parseFloat(88.46))
            console.log(Number.parseFloat("abc"))
            console.log(Number.parseFloat("76.76"))
        }

        {
            console.log(Number.parseInt(82))
            console.log(Number.parseInt(36.42))
            console.log(Number.parseInt("20.43"))
            console.log(Number.parseInt("abc"))
        }

    </script>

</body>

</html>
