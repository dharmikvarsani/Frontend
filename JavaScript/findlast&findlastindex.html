<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FindLast & FindLastIndex</title>
</head>

<body>

    <script>

        {
            let a = [2, 25, 32, -2, 35, -56, -75]

            let b = a.findLast((negative) => negative < 0)
            let c = a.findLastIndex((negative) => negative < 0)
            console.log(b)
            console.log(c)

        }

        {
            let studentName = [
                { name: "Jaggu", age: 13, marks: 46 },
                { name: "Chetan", age: 13, marks: 32 },
                { name: "Neha", age: 12, marks: 42 }
            ]

            let findmarks = studentName.findLast((mark) => mark.marks > 40)
            console.log(findmarks)

            let index = studentName.findLastIndex((age) => age.age > 12)
            console.log(index)
        }

        {
            let fruit = ["Papaya", "Mango", "Watermelon", "Banana", "Custardapple"]

            let findletter = fruit.findLast((letter) => letter.includes("n"))
            console.log(findletter)

            let index = fruit.findLastIndex((letter) => letter.includes("C"))
            console.log(index)
        }



    </script>

</body>

</html>
