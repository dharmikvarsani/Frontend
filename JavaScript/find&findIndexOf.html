<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find & FindIndexOf</title>
</head>

<body>

    <script>


        {
            let a = [2, 15, 16, 19, 20, 17, 26]
            let b = a.find(adult)
            let c = a.findIndex(adult)

            console.log(b)
            console.log(c)

            function adult(age) {
                return age >= 18
            }

        }


        {
            let a = [
                { name: "Sanjay", age: 26 },
                { name: "Kevin", age: 24 },
                { name: "Rajesh", age: 45 }
            ]

            function find(x) {
                return x.name === "Sanjay"
            }

            console.log(a.find(find))
        }


        {
            let studentName = [
                { name: "Rahul", age: 16, marks: 78 },
                { name: "Pratap", age: 16, marks: 67 },
                { name: "Raju", age: 16, marks: 86 }
            ]

            function student(info) {
                return info.name === "Raju"
            }

            console.log(studentName.find(student))
        }


        {
            let cricketerName = [
                { name: "Dhoni", age: 42 },
                { name: "Kohali", age: 37 },
                { name: "Rohit", age: 39 }
            ]

            function cricketers(x) {
                return x.age === 42
            }

            console.log(cricketerName.find(cricketers))

        }

        {
            let a = [1, 2, 3, 4, 6]

            let b = a.find((num, index) => num !== index + 1)

            console.log(b)
        }

        {
            let a = [
                { name: "Apple", price: 100 },
                { name: "Kiwi", price: 120 },
                { name: "Banana", price: 40 }
            ]

            let b = a.find((product) => product.price > 100)
            console.log(b)
        }


        {

            let numbers = [1, 3, 85, -2, 46, -12, -45]

            let negative = numbers.find((Negnumber) => Negnumber < 0)

            console.log(negative)
        }

        {
            let sportsname = [
                { name: "Cricket" },
                { name: "Football" },
                { name: "Rugby" },
                { name: "Vollyball" }
            ]

            let findsport = sportsname.find((sport) => sport.name === "Rugby")
            console.log(findsport)
        }



        //findindexof

        {
            let fruitsName = ["Banana", "Orange", "Watermelon", "Mango", "Papaya"]

            let findfruit = fruitsName.findIndex((fruit) => fruit === "Mango")
            console.log(findfruit)
        }

        {
            let person = [
                { name: "Paramveer", age: 32 },
                { name: "Navankur", age: 26 },
                { name: "Indrajeet", age: 28 }
            ]

            let findage = person.find((age) => age.age > 30)
            console.log(findage)
        }

        {
            let a = [1, 2, 3, 4, 6, 7]

            let b = a.findIndex((value, index) => value !== index + 1)
            console.log(b)
        }

    </script>

</body>

</html>
