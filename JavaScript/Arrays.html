<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrays</title>
</head>

<body>
    <script>

        //arrays
        {
            const cars = ["BMW", " Toyota", "Maruti", "TATA", "Ford"]

            console.log(cars[0])
            console.log(cars[3])
            console.log(cars[2])
        }

        {
            const bikes = ["Hero", "Honda", "BMW", "Bajaj"]
            let bike = bikes[bikes.length - 1]

            console.log(bike)
            console.log(bikes[bikes.length - 2])
            console.log(bikes.length)

            for (let i = 0; i < bikes.length; i++) {
                console.log(bikes[i])
            }

            bikes.forEach((element) => {
                console.log(element + "hii")
            })
        }

        {
            const fruits = ["Apple", "Banana", "Orange", "Watermelon", "Pinaple"]


            console.log(fruits)
            console.log(fruits.length)
            console.log(fruits[fruits.length - 3])


            for (let i = 0; i < fruits.length; i++) {
                console.log(fruits[i])
            }

            fruits.forEach((f) => {
                console.log(f + 123)
            })

        }


        {
            const sports = ["Cricket", "Football", "Vollyball", "Rugby"]

            console.log(sports.length)
            console.log(sports[sports.length - 2])

            for (let i = 0; i < sports.length; i++) {
                console.log(sports[i])
            }

            sports.forEach((sport) => {
                console.log(sport + " " + "is Good")
            })
        }


        {
            const number = [1, 2, 3, 4, 5, 6]

            console.log(number.length)
            console.log(number[number.length - 3])

            for (let i = 0; i < number.length; i++) {
                console.log(number[i])
            }

            number.forEach((num) => {
                console.log(num * num)
            })

        }


        {
            const number = [1, 2, 3, 4, 5, 6, 7, 8, 9]

            console.log(number.length)
            console.log(number[number.length - 3])


            // for ( let i=0 ; i<number.length ; i++){
            //     console.log(number[i])
            // }

            for (let i of number) {
                console.log(i)
            }

            number.forEach((num) => {
                console.log(num + 5)
            })

        }


        {
            const name = ["Dhoni", "Rohit", "Virat ", "Sachin"]
            name.push("Rishabh")
            name[name.length] = "Dinesh"


            console.log(name.length)
            console.log(name[name.length - 3])

            // for (let i of name) {
            //     console.log(i)
            // }

            for (let i = 0; i < name.length; i++) {
                console.log(name[i])
            }

            for (let i in name) {
                console.log(i)
            }

            name.forEach((cricketers) => {
                console.log(cricketers + " " + "Is Batsman")
            })

        }



        {
            const fruit = ["Apple", "Watermelon", "Banana", "Orange"]


            fruit.push("Pinaple")
            console.log(fruit.length)
            console.log(fruit[fruit.length - 2])

            for (let a = 0; a < fruit.length; a++) {
                console.log(fruit[a])
            }

            for (let b of fruit) {
                console.log(b)
            }

            for (let c in fruit) {
                console.log(c)
            }

            fruit.forEach((fruits) => {
                console.log(fruits + " " + "Is Good For Health")
            })

        }


        {
            const Names = ["Rahul", "Rohit", "Rakesh", "Raghu"]

            Names.push("Ramesh")
            Names.pop();
            Names.shift()
            Names.unshift("Raj")
            console.log(Names.pop())
            console.log(Names)
            console.log(Names.length)
            console.log(Names[Names.length - 2])
            console.log(Names.toString())
            console.log(Names.join("-"))
            console.log(Names.shift())
            console.log(Names.unshift())



            // for (let i = 0; i < Names.length; i++) {
            //     console.log(Names[i])
            // }

            for (let b of Names) {
                console.log(b)
            }

            for (let a in Names) {
                console.log(a)
            }

            Names.forEach((name) => {
                console.log(name + " " + "Is A Name.")
            })


        }


        {
            const Boys = ["Raj", "Rakesh", "Nitin"]
            const Girls = ["Rekha", "Pushpa", "Anjali"]
            const Children = Boys.concat(Girls)

            console.log(Children)
            console.log(Boys.copyWithin(1, 0, 2))
            console.log(Girls.copyWithin(0, 1))
        }

        // copyWithin

        {
            const num = [1, 25, 26, 53, 129, 54, 89]

            console.log(num.copyWithin(2, 0, 3))

            num.forEach((number) => {
                console.log(number + " " + " Is Number")
            })

        }



        //flat and flatmap

        {
            const num = [12, 25, 26, 85, [[45, 56, 545, 56]], 475, 45]

            const number = num.flat(2)
            const numb = num.flatMap(x => [x, x * 2])

            console.log(number)
            console.log(numb)

        }


        // slice and spilce

        {
            const a = [25, 24, 63, 2, 86]

            let b = a.slice(1, 3)
            console.log(b)
        }

        {
            const a = [45, 56, 25, 85, 62, 45]

            a.splice(2,2,76,63)
            console.log(a)
        }


        {
            const a = [25, 42, 44, 545, 45]

            // a[1]=85;
            const newarr = a.map(value => (value === 42 ? 85 : value))
            console.log(newarr)

            // for loop ,for each and map diiff, map and filter diff.

        }


        // objects in arrays

        {

                { name: "Dhoni", age: 42, role: "(Wk)Batsman" },

            ]
            // for (let a = 0; a < x.length; a++) {
            //     console.log(x[a].name + " " + x[a].age + " " + x[a].role)
            // }

          for(let a in x){
            console.log(x[a].name + " " + x[a].age + " " + x[a].role)
          }



        }


        //array in objects

        {
            const xyz = {
                name: "rahul",
                age: 24,
                marks: [85, 69, 76, 95, 58, 84]
            }

            console.log(xyz.marks[2])
        }














    </script>
